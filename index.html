
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Видео</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #000;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <video
    id="player"
    src="video.mp4"
    autoplay
    muted
    playsinline
    controls
    preload="auto">
  </video>

  <script>
    const video = document.getElementById("player");
    video.muted = true;
    video.play().catch(() => {
      // Если браузер блокирует автозапуск,
      // пользователь может нажать Play.
    });
  </script>
</body>
</html>
